name: Build and Test SPIR-V with OpenCL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-spirv-cpu:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        llvm-version: [18, 20]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          llvm-${{ matrix.llvm-version }}-dev \
          libzstd-dev \
          ninja-build \
          opencl-headers \
          ocl-icd-opencl-dev \
          pocl-opencl-icd \
          clinfo \
          spirv-tools

    - name: Verify OpenCL CPU runtime
      run: |
        clinfo | head -50 || echo "Warning: clinfo failed"

    - name: Configure and build
      run: |
        env LLVM_DIR=/usr/lib/llvm-${{ matrix.llvm-version }}/cmake \
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLVMBPF_ENABLE_SPIRV=ON -G Ninja
        cmake --build build --target spirv_opencl_test -j$(nproc)

    - name: Run SPIR-V test on CPU
      run: |
        ./build/example/spirv/spirv_opencl_test
      env:
        POCL_DEVICES: basic

    - name: Validate SPIR-V binary
      run: |
        ls -lh bpf_program.spv
        spirv-val bpf_program.spv
        spirv-dis bpf_program.spv -o bpf_program.spvasm
        head -30 bpf_program.spvasm
